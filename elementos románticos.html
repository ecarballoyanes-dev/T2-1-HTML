<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Miotrapaginita</title>
</head>
<body>
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the header */
header {
  background-color: #666;
  padding: 30px;
  text-align: center;
  font-size: 35px;
  color: darkwhite;
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  width: 30%;
  height: 300px; /* only for demonstration, should be removed */
  background: #ccc;
  padding: 20px;
}

/* Style the list inside the menu */
nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: left;
  padding: 20px;
  width: 70%;
  background-color: #f1f1f1;
  height: 300px; /* only for demonstration, should be removed */
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Style the footer */
footer {
  background-color: #767;
  padding: 10px;
  text-align: center;
  color: white;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
</style>
</head>
<body>
<!DOCTYPE html>
<html>
<body>
<header><h1> Los resultados valen la pena</h1> </header>

 <nav>
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Mismo inicio</a></li>
      <li><a href="#">Inicio mismo</a></li>
    </ul>
  </nav>

<section>
<article><h2>Resulta ser entretenido al final</h2></article>
<p>Aprender diferentes lenguajes suele ser engorroso, pero con esfuerzo y dedicación consigues tus objetivos</p>
</section>
<footer>Copyright 2026</footer>
</body>
</html>
